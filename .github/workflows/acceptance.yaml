name: Acceptance

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: prova-rs/run-action@v1
        with:
          profile: ci
